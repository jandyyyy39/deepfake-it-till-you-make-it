[project]
name = "deepfake-it-tymi"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "diffusers[torch]==0.33.1",
    "gdown>=5.2.1",
    "grad-cam>=1.5.5",
    "lpips>=0.1.4",
    "matplotlib>=3.10.8",
    "numpy<2.0.0",
    "opencv-python<4.11.0",
    "scikit-learn>=1.7.2",
    "torch==2.4.0",
    "torchaudio>=2.4.0",
    "torchvision==0.19.0",
    "tqdm>=4.67.3",
    "transformers==4.46.3",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
