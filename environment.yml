name: deepfake_it_tymi_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.4.0
  - torchvision=0.19.0
  - torchaudio
  - pytorch-cuda=12.1
  - pip
  - pip:
      - diffusers[torch]==0.33.1  # For Manifold/Snap-Back
      - transformers==4.46.3      # NLP backbone for Diffusion
      - timm                      # Vision models (CommFor)
      - huggingface-hub           # Model Hub (CommFor)
      - accelerate                # Optimization for low-compute
      - numpy                     # Numerical computing
      - pandas                    # Data manipulation
      - Pillow                    # Image processing
      - opencv-python             # Signal branch/ELA
      - scikit-learn              # Meta-classifier
      - matplotlib                # Visualization
      - grad-cam                  # Interpretability Proof
      - lpips                     # Perceptual quality monitoring
      - tqdm                      # Progress bars
      - gdown                     # Google Drive downloads
      - ipykernel                 # Jupyter support
      - requests                  # HTTP requests
      - beautifulsoup4            # HTML parsing
